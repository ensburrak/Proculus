name: AutoTraderBot V5 Fresh Crosscheck

on:
  push:
    branches:
      - research/atb-v5-fresh-crosscheck-20261008
    paths:
      - tools/atb_v5_fresh_crosscheck.py
      - .github/workflows/atb-v5-fresh-crosscheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run locked fresh holdout cross-check
        run: python tools/atb_v5_fresh_crosscheck.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atb-v5-fresh-crosscheck
          path: atb_v5_crosscheck_result.json
          if-no-files-found: warn
          retention-days: 30
