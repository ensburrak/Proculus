[project]
name = "autotraderbot"
version = "0.2.0"
description = "Risk-first automated trading runtime with API, paper/demo execution, and validation tooling."
requires-python = ">=3.12"
dependencies = [
    "ccxt==4.5.14",
    "python-dotenv==1.2.2",
    "requests==2.33.0",
    "idna==3.15",
    "urllib3==2.7.0",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "ta-lib==0.6.8",
    "torch==2.11.0",
    "scikit-learn==1.7.2",
    "stable-baselines3==2.7.0",
    "gymnasium==1.2.2",
    "streamlit==1.54.0",
    "GitPython==3.1.50",
    "protobuf==6.33.5",
    "tornado==6.5.5",
    "aiohttp==3.13.4",
    "websockets==15.0.1",
    "schedule==1.2.2",
    "prometheus-client==0.23.1",
    "pyarrow==24.0.0",
    "openpyxl==3.1.5",
    "PyYAML==6.0.2",
    "openai==2.24.0",
    "psutil==5.9.8",
    "filelock==3.29.0",
    "setuptools==81.0.0",
    "wheel==0.46.2",
    "fonttools==4.60.2",
    "lxml==6.1.0",
    "pycryptodome==3.23.0",
    "optuna==4.3.0",
    "Mako==1.3.12",
    "lightgbm==4.6.0",
    "xgboost==3.2.0",
    "statsmodels==0.14.6",
    "scipy==1.16.3",
    "fastapi==0.136.3",
    "starlette==1.2.1",
    "uvicorn==0.41.0",
    "python-multipart==0.0.27",
    "tqdm==4.67.1",
    "Pygments==2.20.0",
    "Werkzeug==3.1.6",
    "cryptography==46.0.7",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
    "hypothesis==6.152.1",
    "pip-audit==2.10.0",
]

[project.scripts]
autotraderbot = "autotraderbot.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [
    "comparisons",
    "data",
    "backups",
    "venv",
    ".venv",
    ".pytest_cache",
    ".pytest_cache_test",
    ".pytest_local_tmp",
    ".pytest_local_run_*",
    "tmp_pip",
    "tmp_pip2",
    "tests/_tmp_local",
    "tests/_tmp_pytest",
    "tests/controller_postprocess_*",
    "data/_pytest_local_tmp",
    "data/_pytest_local_tmp*",
]
addopts = "-p no:cacheprovider --tb=short -q --strict-markers --strict-config -m 'not slow and not integration and not e2e and not performance' --ignore=tests/unit/test_ai_batch_manager_success_unit.py --ignore=tests/unit/test_ai_batch_orchestrator_unit.py"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks full end-to-end workflow tests",
    "okx_demo: marks OKX demo integration tests requiring demo credentials and simulated-trading headers",
    "performance: marks performance/benchmark tests (run explicitly with '-m performance')",
]

[tool.coverage.run]
branch = true
source = [
    "core",
    "risk",
    "config_validator",
    "ml",
]
omit = [
    "tests/*",
    "docs/*",
    "tools/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
include = [
    "core/decision_pipeline.py",
    "core/event_bus.py",
    "core/execution_router.py",
    "core/state_persistence.py",
    "core/error_recovery.py",
    "core/order_executor.py",
    "core/engine/bot.py",
    "risk/config.py",
    "risk/manager.py",
    "risk/portfolio_guard.py",
    "risk/kill_switch.py",
    "risk/account_risk.py",
    "config_validator.py",
    "ml/transformer_inference.py",
    "ml/attention_analysis.py",
    "ml/training_orchestrator.py",
    "ml/model_deployer.py",
    "ml/feature_cache.py",
]

[tool.black]
line-length = 120
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | backups
  | comparisons
  | data
  | frontend/dist
  | frontend/node_modules
  | logs
  | reports
  | scratch
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["api", "autotraderbot", "core", "decision", "execution", "ml", "risk", "runtime"]
skip_glob = [
  ".venv/*",
  "backups/*",
  "comparisons/*",
  "data/*",
  "frontend/dist/*",
  "frontend/node_modules/*",
  "logs/*",
  "reports/*",
  "scratch/*",
  "venv/*",
]
