name: Fresh All Symbol Audit

on:
  push:
    branches:
      - research/fresh-all-symbol-audit-20260930
    paths:
      - tools/fresh_all_symbol_baseline.py
      - .github/workflows/fresh-all-symbol-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run fresh all-symbol OOS audit
        run: python tools/fresh_all_symbol_baseline.py --days 180 --oos-days 60 --output fresh_all_symbol_results.json
      - name: Upload fresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-all-symbol-results
          path: fresh_all_symbol_results.json
          if-no-files-found: warn
