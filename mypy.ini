[mypy]
python_version = 3.12
strict = True
files = api/rate_limit.py, decision/state.py, decision/llm_bias.py, decision/score_calculator_service.py, decision/risk_model_service.py, model_performance_monitor.py, telegram_notifier.py, prometheus_exporter.py, tools/critical_coverage_gate.py, tools/run_integration_suite.py, tools/health/check_quality_budget.py, tools/llm_ab_shadow_report.py, tools/grid_dca_evidence.py, runtime/runtime_entry_governor.py, runtime/startup_services.py, runtime/cpu_worker.py, risk/config.py, risk/margin_snapshot_cache.py, core/order_execution_metrics.py, core/ops_alerts.py, core/execution_contracts.py, core/market_notional.py, execution/decision_audit.py
ignore_missing_imports = True
follow_imports = skip
show_error_codes = True
warn_unused_ignores = True
warn_redundant_casts = True
disable_error_code = import-untyped
exclude = ^(data/|tmp_pip/|tmp_pip2/|tests/_tmp_local/|tests/controller_postprocess_|circuit_breaker\.py$)
