name: Fresh Proculus V2 Two Year Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/fetch_okx_two_year_replay_data.py
      - tools/fresh_two_year_v2_backtest.py
      - decision/**
      - runtime/**
      - risk/**
      - config.json
      - .github/workflows/fresh-v2-two-year-backtest.yml

concurrency:
  group: proculus-v2-two-year-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build replay cache key
        id: replay-key
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          cfg_path = root / "config" / "trading.json"
          if not cfg_path.exists():
              cfg_path = root / "config.json"
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
          subset = {
              "trade_parameters": cfg.get("trade_parameters", {}),
              "symbol_filters": cfg.get("symbol_filters", {}),
              "fetcher_sha256": hashlib.sha256(
                  (root / "tools" / "fetch_okx_two_year_replay_data.py").read_bytes()
              ).hexdigest(),
          }
          digest = hashlib.sha256(
              json.dumps(subset, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()[:20]
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"date={today}\n")
              fh.write(f"digest={digest}\n")
          PY

      - name: Restore same-day OKX replay cache
        id: replay-cache
        uses: actions/cache@v4
        with:
          path: |
            scratch/fresh_proculus_two_year/ohlcv
            scratch/fresh_proculus_two_year/fetch_metadata.json
          key: proculus-okx-730-${{ steps.replay-key.outputs.date }}-${{ steps.replay-key.outputs.digest }}

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow requests

      - name: Fetch fresh OKX 730-day runtime-eligible universe
        if: steps.replay-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf scratch/fresh_proculus_two_year
          mkdir -p scratch/fresh_proculus_two_year/ohlcv
          python tools/fetch_okx_two_year_replay_data.py \
            --days 730 \
            --workers 6 \
            --output-dir scratch/fresh_proculus_two_year/ohlcv \
            --metadata-output scratch/fresh_proculus_two_year/fetch_metadata.json

      - name: Run fresh integrated V2 replay with embargoed OOS
        run: |
          rm -f scratch/fresh_proculus_two_year/result.json
          python tools/fresh_two_year_v2_backtest.py \
            --days 730 \
            --holdout-days 180 \
            --embargo-hours 48 \
            --initial-balance 10000 \
            --fee-bps 5 \
            --slippage-bps 5,15,50 \
            --data-dir scratch/fresh_proculus_two_year/ohlcv \
            --output scratch/fresh_proculus_two_year/result.json

      - name: Print compact result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("scratch/fresh_proculus_two_year")
          result = json.loads((root / "result.json").read_text())
          fetch = json.loads((root / "fetch_metadata.json").read_text())
          print("PROCULUS_FINAL_RESULT=" + json.dumps({
              "downloaded_count": fetch.get("downloaded_count"),
              "universe": fetch.get("universe"),
              "candidate_count": result.get("candidate_count"),
              "period_meta": result.get("period_meta"),
              "scenarios": result.get("scenarios"),
              "development": result.get("period_scenarios", {}).get("development"),
              "oos_holdout": result.get("period_scenarios", {}).get("oos_holdout"),
              "oos_acceptance": result.get("oos_acceptance"),
          }, separators=(",", ":")))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: fresh-proculus-v2-two-year-backtest
          path: |
            scratch/fresh_proculus_two_year/result.json
            scratch/fresh_proculus_two_year/fetch_metadata.json
          retention-days: 14
          if-no-files-found: error
