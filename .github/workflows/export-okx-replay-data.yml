name: Export Cached OKX Replay Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-okx-replay-data.yml

concurrency:
  group: proculus-export-okx-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build replay cache key
        id: replay-key
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path(".")
          cfg_path=root/"config"/"trading.json"
          if not cfg_path.exists():
              cfg_path=root/"config.json"
          cfg=json.loads(cfg_path.read_text(encoding="utf-8"))
          subset={
              "trade_parameters":cfg.get("trade_parameters",{}),
              "symbol_filters":cfg.get("symbol_filters",{}),
              "fetcher_sha256":hashlib.sha256(
                  (root/"tools"/"fetch_okx_two_year_replay_data.py").read_bytes()
              ).hexdigest(),
          }
          digest=hashlib.sha256(
              json.dumps(subset,sort_keys=True,separators=(",",":")).encode("utf-8")
          ).hexdigest()[:20]
          today=datetime.now(timezone.utc).strftime("%Y-%m-%d")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"date={today}\n")
              fh.write(f"digest={digest}\n")
          PY

      - name: Restore same-day OKX replay cache
        id: replay-cache
        uses: actions/cache@v4
        with:
          path: |
            scratch/fresh_proculus_two_year/ohlcv
            scratch/fresh_proculus_two_year/fetch_metadata.json
          key: proculus-okx-730-${{ steps.replay-key.outputs.date }}-${{ steps.replay-key.outputs.digest }}

      - name: Require replay cache
        if: steps.replay-cache.outputs.cache-hit != 'true'
        run: |
          echo "Same-day replay cache unavailable."
          exit 1

      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow

      - name: Convert parquet replay cache to portable pickle gzip
        run: |
          rm -rf scratch/portable_okx_replay
          mkdir -p scratch/portable_okx_replay/ohlcv
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          import pandas as pd

          src=Path("scratch/fresh_proculus_two_year")
          dst=Path("scratch/portable_okx_replay")
          rows=[]
          for p in sorted((src/"ohlcv").glob("*.parquet")):
              df=pd.read_parquet(p)
              out=dst/"ohlcv"/(p.stem+".pkl.gz")
              df.to_pickle(out,compression="gzip",protocol=4)
              rows.append({"source":p.name,"portable":out.name,"rows":len(df)})
          shutil.copy2(src/"fetch_metadata.json",dst/"fetch_metadata.json")
          manifest={
              "source":"Proculus same-day OKX replay cache",
              "history_days":730,
              "format":"pandas_pickle_gzip_protocol4",
              "file_count":len(rows),
              "files":rows,
          }
          (dst/"export_manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          print(json.dumps({"file_count":len(rows),"rows":sum(x["rows"] for x in rows)}))
          PY

      - name: Upload portable replay dataset
        uses: actions/upload-artifact@v4
        with:
          name: okx-730d-replay-portable
          path: scratch/portable_okx_replay
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
