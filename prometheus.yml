# Prometheus Configuration for AutoTraderBot
# ===========================================================================
# This file configures Prometheus to scrape metrics from the trading bot.
#
# Usage with docker-compose:
#   docker-compose --profile with-monitoring up -d
#
# Access:
#   Prometheus: http://localhost:9090
#   Grafana: http://localhost:3000 (admin/admin)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'autotraderbot'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AutoTraderBot metrics (if bot exposes /metrics endpoint)
  - job_name: 'autotraderbot'
    static_configs:
      - targets: ['bot:9100']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'
    scrape_interval: 60s
    scrape_timeout: 10s

  # Promtail metrics
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    metrics_path: '/metrics'
    scrape_interval: 60s
    scrape_timeout: 10s
