name: HIZLITRADE Host Regression Tests

on:
  push:
    branches:
      - research/hizlitrade-profitability-host-20261003
      - research/hizlitrade-nested-validation-20261003
    paths:
      - tools/fresh_hizlitrade_backtest.py
      - hizlitrade/**
      - tests_hizli/**
      - .github/workflows/hizlitrade-host-tests.yml

permissions:
  contents: read

concurrency:
  group: hizlitrade-host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install 'pytest>=8,<9' 'pytest-asyncio>=0.24,<1' 'ruff>=0.9,<1' 'mypy>=1.13,<2'
      - name: Ruff mirrored HIZLITRADE surface
        run: ruff check hizlitrade tools/fresh_hizlitrade_backtest.py tests_hizli
      - name: Compile mirrored HIZLITRADE surface
        run: python -m compileall -q hizlitrade tools/fresh_hizlitrade_backtest.py
      - name: Run mirrored HIZLITRADE regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests_hizli
