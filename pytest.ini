[pytest]
asyncio_mode = auto
testpaths = tests
norecursedirs = comparisons data backups venv .venv .pytest_cache .pytest_cache_test .pytest_local_tmp .pytest_local_run_* tmp_pip tmp_pip2 tests/_tmp_local tests/_tmp_pytest tests/controller_postprocess_* data/_pytest_local_tmp data/_pytest_local_tmp*
addopts = -p no:cacheprovider --tb=short -q --strict-markers --strict-config -m "not slow and not integration and not e2e and not performance" --ignore=tests/unit/test_ai_batch_manager_success_unit.py --ignore=tests/unit/test_ai_batch_orchestrator_unit.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    e2e: marks full end-to-end workflow tests
    okx_demo: marks OKX demo integration tests requiring demo credentials and simulated-trading headers
    performance: marks performance/benchmark tests (run explicitly with '-m performance')
