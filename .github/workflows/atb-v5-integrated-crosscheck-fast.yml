name: AutoTraderBot V5 Integrated Crosscheck Fast

on:
  push:
    branches:
      - research/atb-v5-integrated-crosscheck-20261008
    paths:
      - tools/atb_v5_integrated_crosscheck_fast.py
      - .github/workflows/atb-v5-integrated-crosscheck-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run locked integrated cross-check
        run: python tools/atb_v5_integrated_crosscheck_fast.py
      - name: Upload integrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atb-v5-integrated-crosscheck-fast
          path: atb_v5_integrated_crosscheck_fast_result.json
          if-no-files-found: warn
          retention-days: 30
