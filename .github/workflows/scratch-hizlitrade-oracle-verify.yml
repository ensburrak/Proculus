name: Scratch HIZLITRADE Oracle Reference Verify

on:
  push:
    branches:
      - scratch/hizlitrade-fresh-oos-20261004
    paths:
      - scratch_verify/**
      - .github/workflows/scratch-hizlitrade-oracle-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install "pytest>=8,<9" "pydantic>=2.9,<3" "pydantic-settings>=2.5,<3" "prometheus-client>=0.21,<1" "ruff>=0.9,<1" "mypy>=1.13,<2"
      - name: Ruff
        run: ruff check scratch_verify/hizlitrade scratch_verify/tests
      - name: Focused tests
        env:
          PYTHONPATH: scratch_verify
        run: pytest -q scratch_verify/tests
      - name: Mypy focused runtime
        if: always()
        env:
          MYPYPATH: scratch_verify
        run: mypy --strict scratch_verify/hizlitrade/engine/edge.py scratch_verify/hizlitrade/engine/fair_value.py
