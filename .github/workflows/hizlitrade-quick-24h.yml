name: HIZLITRADE Quick 24h Audit

on:
  push:
    branches:
      - research/hizlitrade-profitability-host-20261003
      - research/hizlitrade-nested-validation-20261003
    paths:
      - tools/fresh_hizlitrade_backtest.py
      - hizlitrade/**
      - .github/workflows/hizlitrade-quick-24h.yml

permissions:
  contents: read

concurrency:
  group: hizlitrade-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore immutable historical audit cache
        uses: actions/cache@v4
        with:
          path: .cache/hizlitrade-audit
          key: hizlitrade-audit-v1-${{ runner.os }}-${{ github.sha }}-24h
          restore-keys: |
            hizlitrade-audit-v1-${{ runner.os }}-
      - name: Run quick fresh HIZLITRADE audit
        env:
          PYTHONPATH: .
        run: python tools/fresh_hizlitrade_backtest.py --hours 24 --output fresh_hizlitrade_24h.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-hizlitrade-24h
          path: fresh_hizlitrade_24h.json
          if-no-files-found: error
          retention-days: 7
